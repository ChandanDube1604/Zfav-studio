<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zfav Studio - Secure Collaboration</title><meta name="description" content="Secure collaboration app for animation studios: protected files, traceable watermarks, guest showcase."><meta name="theme-color" content="#2E3A87">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#2E3A87;--acc:#F2594B;--vio:#7B6CF0;--pink:#F2688F;--amb:#F7B84B;--cream:#FFF6E5;--bg:#F7F8FC;--card:#fff;--bd:#E6E8F0;--tx:#14162B;--mu:#6B7089;--ok:#2BB673;--bad:#E5484D;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;background:#E9EBF5;color:var(--tx);font-size:15px;display:flex;justify-content:center;align-items:center}
#app{width:100%;max-width:410px;height:100%;max-height:860px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:500px){#app{height:min(860px,96vh);border-radius:36px;box-shadow:0 20px 60px rgba(46,58,135,.25);border:8px solid #14162B}}
main{flex:1;overflow-y:auto;padding:16px}
h1{font-size:24px;font-weight:700}h2{font-size:20px;font-weight:600}h3{font-size:16px;font-weight:600}
.mu{color:var(--mu);font-size:13px}.sm{font-size:12px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}.top h2{flex:1}
.ic{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--bd);display:grid;place-items:center;cursor:pointer;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(20,22,43,.04)}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:12px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:600 15px inherit;font-family:inherit;cursor:pointer;background:var(--acc);color:#fff;margin-top:8px}
.btn.s{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}.btn.p{background:var(--pri)}.btn.d{background:#E9EAF1;color:#9a9db3;cursor:default}
.btn.t{background:none;color:var(--acc);padding:10px}
.btn:focus-visible,.nav button:focus-visible,[data-a]:focus-visible{outline:3px solid var(--vio);outline-offset:2px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:13px;border:1px solid var(--bd);border-radius:12px;font:15px inherit;font-family:inherit;background:#fff;color:var(--tx)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:#EDEEF7;color:var(--pri)}
.chip.ok{background:#E2F6EC;color:#1d8a56}.chip.am{background:#FEF0D6;color:#9a6a0c}.chip.bd{background:#FDE5E3;color:#c4362a}.chip.vi{background:#ECE9FD;color:#5b4bd0}.chip.ac{background:var(--acc);color:#fff}.chip.pr{background:var(--pri);color:#fff}
.nav{display:flex;background:#fff;border-top:1px solid var(--bd);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:none;font:500 11px inherit;font-family:inherit;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer}
.nav button b{font-size:18px;font-weight:400}.nav .on{color:var(--acc);font-weight:700}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pink)}
.thumb{width:100%;height:120px;border-radius:12px;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:700}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.wm span{transform:rotate(-24deg);font-size:13px;font-weight:600;color:rgba(255,255,255,.7);white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.ban{background:var(--acc);color:#fff;font-size:12px;font-weight:600;padding:8px 12px;border-radius:0 0 12px 12px;margin-top:-4px}
.bar{height:8px;border-radius:9px;background:#E6E8F0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--vio));border-radius:9px;transition:width 1.2s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px}.stat b{font-size:26px;display:block}
.anc{background:var(--cream);border:1px solid #F5E3BE;border-radius:16px;padding:14px;margin-bottom:12px}
.kan{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.kan>div{min-width:150px;flex:1}.kan .card{padding:10px;cursor:pointer}
.msg{max-width:82%;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--bd);margin-bottom:8px;font-size:14px}.msg.me{margin-left:auto;background:#E6E9FA;border-color:#D3D8F5}
.tog{width:44px;height:26px;border-radius:99px;background:#D8DAE6;position:relative;cursor:pointer;border:0;flex:none}.tog:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tog.on{background:var(--acc)}.tog.on:after{left:21px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--tx);color:#fff;padding:12px 14px;border-radius:12px;font-size:13px;z-index:9}
.center{text-align:center}.hero{padding:30px 8px 10px}.hero img{width:150px}
.sec{font-weight:600;margin:14px 0 8px}
.stk .av{width:30px;height:30px;font-size:11px;margin-left:-8px;box-shadow:0 0 0 2px #fff}.stk .av:first-child{margin-left:0}.ic{position:relative}main{min-height:0}.toast{max-width:420px;margin:0 auto}
@media(min-width:900px){
body{align-items:stretch;background:var(--bg)}
#app{max-width:none;max-height:none;height:100vh;border:0;border-radius:0;box-shadow:none;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
#app.wn{grid-template-columns:250px minmax(0,1fr)}
#app.wn .nav{grid-column:1;grid-row:1/4;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--bd);padding:24px 12px}
.nav button{flex:none;flex-direction:row;font-size:15px;gap:12px;padding:12px 14px;border-radius:12px;justify-content:flex-start}
.nav .on{background:#FDEBE9}
.top,main,.inp{width:100%;max-width:1040px;margin-left:auto;margin-right:auto}
#app.wn .top,#app.wn main,#app.wn .inp{grid-column:2}
main{padding:24px 32px}#app.pub main{max-width:440px}
main.m2{columns:2;column-gap:16px}.m2 .card{break-inside:avoid}
.grid2{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.kan>div{min-width:0}}
</style></head><body><div id="app"></div>
<script>
window.addEventListener('error',e=>{const a=document.getElementById('app');if(a&&!a.innerHTML.trim())a.innerHTML='<main><h2>Something went wrong</h2><p class="mu">'+e.message+'</p></main>'});

const K='zfav_v2',D={admin:null,mem:[],guests:[],files:[],tasks:[],proj:[],chat:{General:[]},pay:[],notes:[],meet:[],log:[],site:{tag:'',about:'',email:''},ann:''};
const S={...D,u:null,scr:'login',tab:'home',st:[],ch:null,fi:null,pi:null,pt:'Invoices',draft:null,show:0,fresh:null,last:null,tg:{wm:1,enc:1}};
try{const x=JSON.parse(localStorage.getItem(K)||'{}');Object.keys(D).forEach(k=>{if(x[k]!==undefined)S[k]=x[k]})}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(Object.fromEntries(Object.keys(D).map(k=>[k,S[k]]))))}catch(e){}};
const $=s=>document.querySelector(s),val=i=>($('#'+i)||{value:''}).value.trim();
const H=async p=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const cols=['#2E3A87','#7B6CF0','#F2594B','#2BB673','#F2688F'],now=()=>new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const ppl=()=>[S.admin,...S.mem].filter(Boolean),who=id=>ppl().find(p=>p.id===id)||{n:'Unknown',r:''};
const isA=()=>S.u&&S.u.r==='Admin',isG=()=>S.u&&S.u.r==='Guest',canM=()=>S.u&&['Admin','Producer','Director','Team Lead'].includes(S.u.r),canP=()=>S.u&&['Admin','Finance'].includes(S.u.r);
const ini=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase(),av=(n,i=0)=>`<div class="av" style="background:${cols[i%5]}">${ini(n)}</div>`;
const stk=ids=>`<div class="stk row" style="gap:0">${ids.slice(0,4).map((id,i)=>av(who(id).n,i)).join('')}</div>`;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip=(t,c='')=>`<span class="chip ${c}">${esc(t)}</span>`,roleChip=r=>chip(r,r==='Admin'?'ac':r==='Guest'||r==='Artist'?'vi':'pr');
const empty=(t,s)=>`<div class="card center"><b>${t}</b><div class="mu sm" style="margin-top:4px">${s}</div></div>`;
const note=(tx,f='all')=>S.notes.unshift({tx,f,t:now()}),vis=n=>n.f==='all'||n.f===S.u.id||(n.f==='mgr'&&canM())||(n.f==='admin'&&isA());
const logit=(t,x)=>S.log.unshift({t,x,w:now()});
const fst=f=>f.st==='Revoked'?'Revoked':(f.exp&&new Date(f.exp)<new Date()?'Expired':'Active');
const wmText=()=>isG()?`Guest - ${S.u.n} - ${now()}`:`${S.u.n} - ${S.u.id.split('-')[2]||''} - ${now()}`;
const thumb=(l,i,w=1)=>`<div class="thumb" style="background:linear-gradient(135deg,${cols[i%5]},${cols[(i+2)%5]})">${esc(l)}${w?`<div class="wm"><span>${esc(wmText())}</span></div>`:''}</div>`;
const hd=(t,b=1)=>`<div class="top">${b?'<div class="ic" data-a="back" role="button" tabindex="0">&#8592;</div>':''}<h2>${t}</h2></div>`;
const tog=k=>`<button class="tog ${S.tg[k]?'on':''}" data-a="tg:${k}" aria-label="toggle"></button>`;
const sel=(id,arr)=>`<select id="${id}">${arr.map(a=>`<option value="${esc(a[0])}">${esc(a[1])}</option>`).join('')}</select>`;
const pct=p=>{const t=S.tasks.filter(x=>x.p===p);return t.length?Math.round(t.filter(x=>x.c===3).length/t.length*100):0};
const dl=d=>{if(!d)return'No deadline';const n=Math.ceil((new Date(d)-Date.now())/864e5);return n>=0?n+' days left':'Overdue'};
const mk=(id,r)=>{const n=id.split(' ')[0].toUpperCase().replace(/[^A-Z]/g,'')||'USER';let x;do{x='ZF-'+n+'-'+(1000+Math.floor(Math.random()*9000))+'-'+String.fromCharCode(65+Math.random()*26|0)+String.fromCharCode(65+Math.random()*26|0)}while(ppl().some(p=>p.id===x));return x};
const go=(s)=>{S.st.push([S.scr,S.tab]);S.scr=s;R()},back=()=>{const p=S.st.pop();if(p){S.scr=p[0];S.tab=p[1]}R()};
function say(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';$('#app').appendChild(t)}t.textContent=m;clearTimeout(S.tt);S.tt=setTimeout(()=>t.remove(),2600)}
const V={};

 async mkadmin(){const n=val('an'),p=$('#ap').value;if(!n||p.length<8)return say('Enter your name and a password of 8+ characters.');S.admin={n,id:mk(n),r:'Admin',ph:await H(p),st:'Active',d:1};S.fresh=S.admin.id;R()},

 gc(){S.scr='gcode';R()},lo(){S.scr='login';R()},
 gin(){const g=S.guests.find(x=>x.code===val('gcd').toUpperCase()&&x.on);if(!g)return say('That code is not valid. Ask the studio for a new one.');g.v++;S.u={n:g.c,id:'GUEST',r:'Guest'};S.st=[];S.tab='showcase';S.scr='showcase';R()},

 logout(){S.u=null;S.st=[];S.scr='login';S.tab='home';R()},
 ann(){S.ann=val('an');R()},
 np(){if(!canM())return;const n=val('pn');if(!n)return say('Enter a project name.');S.proj.push({id:Date.now(),n,ds:val('pds'),dl:val('pdl'),g:0});note('New project: '+n);R()},
 pd(a){S.pi=+a[0];go('pdetail')},
 pg(a){S.proj[a[0]].g=S.proj[a[0]].g?0:1;R()},

 ap(a){const t=S.tasks[a[0]],c=val('rc'+a[0]);if(c)t.cm.push({w:S.u.n,x:c});t.c=3;note('Approved: '+t.t,t.to);R()},
 rj(a){const t=S.tasks[a[0]],c=val('rc'+a[0]);if(!c)return say('Add a comment explaining the changes.');t.cm.push({w:S.u.n,x:c});t.c=1;note('Changes requested on "'+t.t+'": '+c,t.to);R()},
 ch(a){S.ch=a.join(':');go('channel')},
 nc(){const n=val('cn');if(!n||S.chat[n])return say('Enter a new channel name.');S.chat[n]=[];R()},
 send(){const v=val('m');if(!v)return;S.chat[S.ch].push({u:S.u.id,x:v});R()},
 pv(a){S.fi=+a[0];go('preview')},
 tg(a){S.tg[a[0]]=!S.tg[a[0]];R()},
 doprot(){const f=($('#pf').files||[])[0];if(!f)return say('Choose a file first.');const sz=f.size>1048576?(f.size/1048576).toFixed(1)+' MB':Math.ceil(f.size/1024)+' KB';S.files.unshift({f:f.name,sz,to:val('pa'),exp:val('pe'),st:'Active',t:now(),enc:S.tg.enc,wm:S.tg.wm});note('A protected file was assigned to you: '+f.name,val('pa'));S.st.pop();S.scr='drive';S.tab='drive';R();say('Protected and assigned')},
 rv(a){S.files[a[0]].st='Revoked';logit('File revoked',S.files[a[0]].f);R()},
 pt(a){S.pt=a[0];R()},
 npay(){const t=val('yt'),a=val('ya');if(!t||!a||!S.mem.length)return say('Enter a title, person and amount.');S.pay.unshift({ti:t,m:val('ym'),a,ty:val('yy'),st:'Pending',d:now()});S.pt=val('yy');note('New payment record: '+t,val('ym'));R()},
 ps(a){const p=S.pay[a[0]];p.st=p.st==='Paid'?'Pending':'Paid';if(p.st==='Paid')note('Payment marked paid: '+p.ti,p.m);R()},
 exp(){const c='Title,Person,Amount,Type,Status,Date\n'+S.pay.map(p=>[p.ti,who(p.m).n,p.a,p.ty,p.st,p.d].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');try{navigator.clipboard.writeText(c);say('CSV copied')}catch(e){say('Copy is not available in this browser')}},
 nm(){const t=val('mt');if(!t)return say('Enter a meeting title.');S.meet.push({t,w:val('mw').replace('T',' ')||'No time set'});note('New meeting: '+t);R()},
 gen(){const n=val('cn2');if(!n)return say('Enter the member name first.');const id=mk(n);S.draft={n,r:$('#cr').value,id,pw:Math.random().toString(36).slice(2,6)+Math.random().toString(36).slice(2,6)};S.show=0;R()},
 eye(){S.show=!S.show;R()},
 copy(){const d=S.draft;try{navigator.clipboard.writeText(`Zfav Studio login\nID: ${d.id}\nPassword: ${d.pw}`)}catch(e){}say('Credentials copied')},
 copyl(){try{navigator.clipboard.writeText(`Zfav Studio login\nID: ${S.last.id}\nPassword: ${S.last.pw}`)}catch(e){}say('Credentials copied')},
 async mkm(){const d=S.draft;S.mem.push({n:d.n,id:d.id,r:d.r,ph:await H(d.pw),st:'Pending',d:0,first:1});S.last={id:d.id,pw:d.pw};S.draft=null;S.st.pop();S.scr='members';R()},
 async rpw(a){const m=S.mem[a[0]],pw=Math.random().toString(36).slice(2,10);m.ph=await H(pw);m.first=1;S.last={id:m.id,pw};R()},
 sus(a){const m=S.mem[a[0]];m.st=m.st==='Suspended'?'Active':'Suspended';logit(m.st==='Suspended'?'Account suspended':'Account restored',m.n);R()},
 mkg(){const c=val('gn');if(!c)return say('Enter the client company.');S.guests.unshift({c,code:'GST-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+(10+Math.random()*89|0),v:0,on:1});R()},
 rg(a){S.guests[a[0]].on=0;logit('Guest link revoked',S.guests[a[0]].c);R()},
 site(){S.site={tag:val('st'),about:val('sa'),email:val('se')};R();say('Profile saved')},
 enq(){const n=val('en'),m=val('em');if(!n||!m)return say('Enter your name and a message.');note(`Enquiry from ${n}${val('ec')?' ('+val('ec')+')':''}: ${m}`,'admin');say('Enquiry sent. The studio will reply soon.')},
 toast:a=>say(a.join(':'))};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const p=el.dataset.a.split(':'),k=p.shift();if(k==='go'){go(p[0]);return}if(A[k])A[k](p)});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.dataset&&t.dataset.a)t.click();if(e.key==='Enter'&&t.id==='m')A.send()});
['contextmenu','copy'].forEach(ev=>document.addEventListener(ev,e=>{if(['preview','gproj','review'].includes(S.scr)||S.tab==='gproj')e.preventDefault()}));
R();
</script></body></html>
